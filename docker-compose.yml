# ============================================================================
# DocuMind — Data-store + Ollama stack for local development
# ============================================================================
# Philosophy: this file runs ONLY the infrastructure tier. Application services
# are run natively (go run / uvicorn / npm run dev) so you get fast rebuilds,
# debuggers, and logs directly. This matches spec §6.3 "Dev Fallback".
#
# For full K8s + Istio deployment, see infra/kind/ and infra/k8s/.
# ============================================================================

name: documind

services:

  # ──────────────────────────────────────────────────────────────────────
  # PostgreSQL — primary relational store (schema-per-service, RLS enabled)
  # ──────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: documind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DOCUMIND_PG_USER:-documind}
      POSTGRES_PASSWORD: ${DOCUMIND_PG_PASSWORD:-documind}
      POSTGRES_DB: ${DOCUMIND_PG_DB:-documind}
      # WAL mode + extra logging for dev
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCUMIND_PG_USER:-documind} -d ${DOCUMIND_PG_DB:-documind}"]
      interval: 5s
      timeout: 3s
      retries: 10
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "log_statement=none"

  # ──────────────────────────────────────────────────────────────────────
  # Qdrant — vector DB
  # ──────────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: documind-qdrant
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "6333:6333"   # HTTP
      - "6334:6334"   # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${DOCUMIND_QDRANT_API_KEY:-}
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      # qdrant 1.11 image lacks wget/curl; bash IS present and supports
      # /dev/tcp. Pure TCP-port-up — sufficient for restart-on-crash;
      # HTTP-level semantics still covered by drill_qdrant_ulimit.
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ──────────────────────────────────────────────────────────────────────
  # Neo4j — knowledge graph
  # ──────────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.21-community
    container_name: documind-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "${DOCUMIND_NEO4J_USER:-neo4j}/${DOCUMIND_NEO4J_PASSWORD:-documind}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
      NEO4J_server_config_strict__validation_enabled: "false"
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${DOCUMIND_NEO4J_USER:-neo4j}", "-p", "${DOCUMIND_NEO4J_PASSWORD:-documind}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────────────────────────────
  # Redis — cache, sessions, rate-limit counters
  # ──────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: documind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ──────────────────────────────────────────────────────────────────────
  # Kafka + Zookeeper — event backbone
  # ──────────────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: documind-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - ./data/zookeeper/data:/var/lib/zookeeper/data
      - ./data/zookeeper/log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: documind-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9094:9094"   # external listener
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - ./data/kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────────────────────────────
  # MinIO — S3-compatible blob store for raw documents
  # ──────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: documind-minio
    restart: unless-stopped
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: ${DOCUMIND_MINIO_ACCESS_KEY:-documind}
      MINIO_ROOT_PASSWORD: ${DOCUMIND_MINIO_SECRET_KEY:-documind-secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Admin UI
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ──────────────────────────────────────────────────────────────────────
  # Ollama — local LLM + embedding server
  # ──────────────────────────────────────────────────────────────────────
  # On a machine with an NVIDIA GPU, uncomment the "deploy" block for ~10x speed.
  ollama:
    image: ollama/ollama:0.3.12
    container_name: documind-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────────────────────────────
  # OpenTelemetry Collector — receives traces/metrics/logs from every service
  # ──────────────────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: documind-otel
    restart: unless-stopped
    command: ["--config=/etc/otel-config.yaml"]
    volumes:
      - ./infra/observability/otel-config.yaml:/etc/otel-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9464:9464"   # Prometheus scrape
    depends_on:
      - jaeger
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:13133/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: documind-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    pid: host
    command:
      - "--path.rootfs=/host"
    volumes:
      - "/:/host:ro,rslave"

  # Postgres exporter — Prometheus metrics for the postgres container.
  # Connects to documind-postgres via the docker network using the same
  # credentials as the app services. Per CLAUDE.md §47.6 (observability
  # is first-class) — without this, postgres latency / connection /
  # query-cache metrics are invisible to Grafana.
  # Locked by mcp/tests/drill_postgres_exporter.py.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: documind-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${DOCUMIND_PG_USER:-documind}:${DOCUMIND_PG_PASSWORD:-documind}@postgres:5432/${DOCUMIND_PG_DB:-documind}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: documind-cadvisor
    restart: unless-stopped
    ports:
      - "8089:8080"
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:rw"
      - "/sys:/sys:ro"
      - "/var/lib/docker:/var/lib/docker:ro"

  # ──────────────────────────────────────────────────────────────────────
  # Prometheus + Grafana + Jaeger (observability stack)
  # ──────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: documind-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: documind-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ALERTMANAGER_DEFAULT_RECEIVER: ${ALERTMANAGER_DEFAULT_RECEIVER:-local-log}
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-http://host.docker.internal:8099/alertmanager-placeholder}
    entrypoint:
      - /bin/sh
      - -ec
    volumes:
      - ./infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - |
          sed \
            -e "s|__DEFAULT_RECEIVER__|$${ALERTMANAGER_DEFAULT_RECEIVER}|g" \
            -e "s|__WEBHOOK_URL__|$${ALERTMANAGER_WEBHOOK_URL}|g" \
            /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml
          exec /bin/alertmanager \
            --config.file=/tmp/alertmanager.yml \
            --storage.path=/alertmanager

  grafana:
    image: grafana/grafana:11.2.0
    container_name: documind-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: documind
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./infra/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./infra/observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./infra/observability/grafana-dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - jaeger
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: documind-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # UI
      - "14250:14250"  # collector gRPC (internal)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:16686/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────────────────────────────
  # NGINX edge — LB + CDN-edge cache + TLS termination + rate limit
  # ──────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: documind-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/nginx-tls:/etc/nginx/tls:ro
      - ./data/nginx-cache:/var/cache/nginx
      - ./data/nginx-logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ──────────────────────────────────────────────────────────────────────
  # ELK stack — Elasticsearch + Filebeat + Kibana
  # ──────────────────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: documind-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: documind-kibana
    restart: unless-stopped
    # Kibana refuses to run as root ("Kibana should not be run as root.
    # Use --allow-root to continue.") — without this user: line the
    # container crashlooped silently every few seconds, hammering the
    # disk + restart counter. Image's built-in kibana user is uid 1000.
    user: "1000:1000"
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      SERVER_PUBLICBASEURL: "http://localhost:5601"
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: documind-filebeat
    restart: unless-stopped
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./infra/elk/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/filebeat:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────────────────
  # Kiali — service-mesh visualization (Istio companion)
  # ──────────────────────────────────────────────────────────────────────
  kiali:
    image: quay.io/kiali/kiali:v1.86
    container_name: documind-kiali
    restart: unless-stopped
    # Kiali v1.86 hard-blocks startup on a Kubernetes cache sync that
    # cannot complete in docker-compose dev mode (no real K8s API).
    # Gating behind --profile mesh means `docker compose up` (the
    # default operator workflow) skips Kiali; the operator opts in
    # explicitly via `docker compose --profile mesh up kiali` ONLY
    # AFTER `bash scripts/istio-up.sh` brings up minikube + Istio.
    # Drilled by step 12 of drill_minikube_istio_setup.py.
    profiles: ["mesh"]
    ports:
      - "20001:20001"
    volumes:
      - ./infra/kiali/kiali.yaml:/kiali-configuration/config.yaml:ro
    # Kiali v1.86 does NOT auto-load /kiali-configuration/config.yaml —
    # the path must be passed via -config or the binary falls back to
    # env-only config and trips the signing-key length check. See
    # infra/kiali/kiali.yaml login_token block + drill_minikube_istio_setup.py
    # step 12 for the locked invariant.
    command: ["-config", "/kiali-configuration/config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:20001/kiali/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - jaeger
      - prometheus

  # ──────────────────────────────────────────────────────────────────────
  # api-gateway — DocuMind Go edge service (sits behind NGINX).
  # Middleware chain: CorrelationID → SecurityHeaders → Logger → CORS →
  #                   BodyLimit → JWT(RS256) → RateLimit → RequireRole →
  #                   reverse proxy.
  # See services/api-gateway/cmd/main.go for the full pipeline.
  # Locked by drill_api_gateway_compose.py.
  # ──────────────────────────────────────────────────────────────────────
  api-gateway:
    # Opt-in via profile to preserve file-header philosophy
    # ("Application services are run natively"). Default `docker compose
    # up` excludes this; bring it up explicitly with:
    #   docker compose --profile app up -d api-gateway
    # NGINX upstream falls back to host.docker.internal:8080 when not
    # running, so native-run gateway continues to work as default.
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: documind-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      API_GATEWAY_HTTP_PORT: 8080
      API_GATEWAY_REDIS_ADDR: redis:6379
      API_GATEWAY_JWKS_URI: ${API_GATEWAY_JWKS_URI:-http://identity-svc:8081/.well-known/jwks.json}
      API_GATEWAY_LOG_LEVEL: ${API_GATEWAY_LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ──────────────────────────────────────────────────────────────────────
  # Langfuse — LLM observability (prompt + completion + cost + trace).
  # Opt-in via profile (per file-header philosophy: app services run
  # natively unless explicitly containerized). Backed by the existing
  # Postgres via a separate logical database (langfuse_db).
  # Locked by drill_langfuse_compose.py.
  #
  # Bring up:    docker compose --profile observability up -d langfuse
  # UI at:       http://localhost:3002  (3001 is grafana)
  # Initial setup: visit UI, create project, copy public+secret keys
  # to .loop/langfuse.env (chmod 600); see docs/runbooks/langfuse.md
  # ──────────────────────────────────────────────────────────────────────
  langfuse:
    profiles: ["observability"]
    image: langfuse/langfuse:2
    container_name: documind-langfuse
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: ${LANGFUSE_DATABASE_URL:-postgres://documind:documind@postgres:5432/langfuse_db}
      DIRECT_URL: ${LANGFUSE_DATABASE_URL:-postgres://documind:documind@postgres:5432/langfuse_db}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3002}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-CHANGE_ME_dev_only_secret_min_32_chars_xx}
      SALT: ${LANGFUSE_SALT:-CHANGE_ME_dev_only_salt_min_32_chars_xx}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_DEFAULT_PROJECT_ID: ${LANGFUSE_DEFAULT_PROJECT_ID:-documind-dev}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- \"http://$$(hostname -i):3000/api/public/health\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes: {}
networks:
  default:
    name: documind
