[pytest]
# Disable the auto-loaded logfire pytest plugins. logfire 4.32.1
# transitively imports `opentelemetry.sdk._logs.ReadableLogRecord`,
# which lands in OTel ≥1.36 — but the venv pins OTel at 1.34.1, so
# the import fails and blocks pytest at collection. Disabling the
# plugins lets pytest run while leaving logfire installed for any
# runtime that explicitly opts in (none does, currently).
#
# Per CLAUDE.md §16 (deps mgmt) + §43 (drill discipline). The proper
# remediation is a coordinated logfire ↔ opentelemetry-sdk pin, but
# that's a §56 dep-change iteration; this opt-out is the minimal
# unblock for drill_service_smoke step 2.
addopts = -p no:logfire -p no:pytest_logfire
asyncio_mode = auto
