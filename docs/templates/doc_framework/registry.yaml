    prompt_path: "docs/templates/doc_framework/brd/prompt.md"
    kpi_dimensions:
      - business_value
      - scope_clarity
      - stakeholder_coverage
      - success_criteria
      - constraints_documented
    min_kpi: 1.0

  - doc_type: hld
