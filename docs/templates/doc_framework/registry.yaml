# Document Framework Registry
#
# Per ADR-029 (Business-usecase → 20-doc generation framework).
# 20 doc types defined here. Each entry is the contract for a doc.
#
# Iter-69 ships this registry + drill_doc_framework_registry.
# Iter-70 ships per-doc skeleton + prompt templates referenced by
# template_path / prompt_path.
#
# When adding a 21st doc type:
#   1. Append entry to this YAML
#   2. Add template + prompt files (iter-70 pattern)
#   3. Drill verifies registry-vs-template consistency

version: 1
default_min_kpi: 1.0   # 100% (per user request); ratchetable per doc

docs:
  - doc_type: srs
    display_name: "Software Requirements Specification"
    owner_role: business_analyst
    reviewer_roles: [product_manager, architect, qa_lead]
    interdept_required: true
    template_path: "docs/templates/doc_framework/srs/skeleton.md"
    prompt_path: "docs/templates/doc_framework/srs/prompt.md"
    kpi_dimensions:
      - completeness
      - clarity
      - testability
      - traceability
      - non_functional_coverage
    min_kpi: 1.0

  - doc_type: brd
    display_name: "Business Requirements Document"
    owner_role: business_analyst
    reviewer_roles: [product_manager, sponsor]
    interdept_required: true
