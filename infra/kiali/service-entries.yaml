---
# Istio ServiceEntries that expose the docker-compose services to the
# minikube/dm-istio mesh so Kiali can graph them. Without these, Kiali
# only sees in-cluster pods (istiod / gateways / kiali); compose
# services like prometheus, grafana, jaeger, kibana, otel collector,
# paperclip MCP, hybrid-architect, etc. are invisible to the mesh.
#
# RESOLUTION: DNS + endpoint host.minikube.internal — Istio resolves the
# endpoint hostname via cluster CoreDNS on every request, then dispatches
# to that IP. (`STATIC` rejects hostnames as endpoint addresses; only
# IP literals are allowed there. `DNS` accepts hostnames AND tolerates
# IP changes — important on dev hosts where the host IP can rotate.)
# LOCATION: MESH_EXTERNAL since these services run outside the K8s mesh
# proper.
#
# These entries are READ-ONLY from the mesh's perspective: the docker-
# compose services don't have envoy sidecars and don't emit Istio mesh
# telemetry, so Kiali's "graph" view shows them as external nodes
# rather than mesh members. The CONSOLE links + dashboards configured
# in kiali-cluster-config.yaml give the operator the full integration.
#
# Drilled by mcp/tests/drill_kiali_advanced_integration.py step 5.
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: documind-prometheus
  namespace: istio-system
  labels:
    app: prometheus
    documind.tool: prometheus
spec:
  hosts:
    - prometheus.documind.external
  ports:
    - number: 9090
      name: http
      protocol: HTTP
  resolution: DNS
  location: MESH_EXTERNAL
  endpoints:
    - address: host.minikube.internal
      ports:
        http: 9090
