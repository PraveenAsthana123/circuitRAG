---
# Kiali configuration — points at the same Prometheus + Jaeger the rest of
# the stack uses. When DocuMind is deployed to minikube + Istio (via
# `bash scripts/istio-up.sh`), Kiali reads mesh topology from the Istio
# control plane and produces a live service-graph.
#
# DOCKER-COMPOSE LIMITATION: Kiali v1.86 hard-blocks startup on a K8s
# cache sync that cannot complete without a real K8s API. The kiali
# service is therefore gated behind `--profile mesh` in docker-compose.yml
# so `docker compose up` skips it. Operators opt in via:
#   bash scripts/istio-up.sh                    # bring up minikube + Istio
#   docker compose --profile mesh up kiali      # then start Kiali
# See docs/runbooks/istio-local-deploy.md for the full workflow.

server:
  port: 20001
  web_root: /kiali

auth:
  strategy: anonymous

# Kiali v1.86+ requires a signing key for session cookies even when
# auth.strategy=anonymous (the binary still initializes the session
# subsystem on startup). Must be exactly 16, 24, or 32 bytes — using
# 32 hex chars (16 bytes). This is a DEV-ONLY default; production
# stacks override via env var or k8s Secret. Drilled by
# drill_minikube_istio_setup.py step 12.
login_token:
  signing_key: "aed516789d7e2dd69b2edd366c1aa2c3"

deployment:
  accessible_namespaces: ["**"]
  cluster_wide_access: false
  logger:
    log_format: json
    log_level: info

# In docker-compose dev mode there's NO K8s cluster. Kiali v1.86 still
# requires a responsive Kubernetes API for useful startup, so this file
# is applied after scripts/istio-up.sh brings up minikube + Istio. The
# cache flag stays false to reduce local-dev overhead; it is NOT a
# compose-only escape hatch.
kubernetes_config:
  cache_enabled: false
  cluster_name: "compose-dev"

external_services:
  istio:
    config_map_name: istio
    istio_sidecar_injector_config_map_name: istio-sidecar-injector
    istiod_deployment_name: istiod
    root_namespace: istio-system
  prometheus:
    url: http://prometheus:9090
  grafana:
    enabled: true
    in_cluster_url: http://grafana:3000
    url: http://localhost:3001
  tracing:
    enabled: true
    provider: jaeger
    in_cluster_url: http://jaeger:16686
    url: http://localhost:16686

kiali_feature_flags:
  disabled_features: []
  validations:
    ignore: []

server_handler_config:
  cors:
    allowed_origins:
      - "*"
