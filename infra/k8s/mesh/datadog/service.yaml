apiVersion: v1
kind: Service
metadata:
  name: mcp-datadog
  namespace: documind
  labels:
    app: mcp-datadog
    app.kubernetes.io/name: mcp-datadog
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: documind
    documind.tool/namespace: datadog
    documind.tool/category: mcp
spec:
  selector:
    app: mcp-datadog
  ports:
    - port: 8123
      targetPort: 8123
      # `name: http` + appProtocol HTTP teaches Istio + Kiali to render
      # this as L7 traffic (not opaque TCP) → service-graph + RPS gauges.
      name: http
      appProtocol: http
      protocol: TCP
---
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: mcp-datadog-tel
  namespace: documind
spec:
  selector:
    matchLabels:
      app: mcp-datadog
  metrics:
    - providers:
        - name: prometheus
      overrides:
        - match:
            metric: REQUEST_COUNT
            mode: CLIENT_AND_SERVER
          tagOverrides:
            documind_tool_namespace:
              value: "'datadog'"
            documind_tool_category:
              value: "'mcp'"
  tracing:
    - providers:
        - name: jaeger
      randomSamplingPercentage: 100
  accessLogging:
    - providers:
        - name: envoy
