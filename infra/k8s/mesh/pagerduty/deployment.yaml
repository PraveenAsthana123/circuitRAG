apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-pagerduty
  namespace: documind
  labels:
    app: mcp-pagerduty
    app.kubernetes.io/name: mcp-pagerduty
    app.kubernetes.io/version: v1
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: documind
    app.kubernetes.io/managed-by: kustomize
    documind.tool/namespace: pagerduty
    documind.tool/category: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-pagerduty
  template:
    metadata:
      labels:
        app: mcp-pagerduty
        app.kubernetes.io/name: mcp-pagerduty
        app.kubernetes.io/version: v1
        app.kubernetes.io/component: mcp-server
        app.kubernetes.io/part-of: documind
        documind.tool/namespace: pagerduty
        documind.tool/category: mcp
        version: v1
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8125"
        prometheus.io/path: "/metrics"
        kiali.io/runtimes: "fastapi,python"
    spec:
      containers:
        - name: server
          image: python:3.11-slim
          command: ["sh", "-c"]
          args:
            - |
              pip install --quiet fastapi uvicorn httpx pydantic prometheus_client opentelemetry-api opentelemetry-sdk opentelemetry-instrumentation-fastapi opentelemetry-exporter-otlp-proto-grpc &&
              cd /app && PYTHONPATH=/app/libs/py:/app python -m mcp.server_pagerduty
          ports:
            - containerPort: 8125
              name: http
              protocol: TCP
          env:
            - name: MCP_PAGERDUTY_PORT
              value: "8125"
            - name: DOCUMIND_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger-collector.istio-system.svc.cluster.local:4317"
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/live
              port: 8125
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8125
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: source
          hostPath:
            path: /mnt/deepa/rag
            type: Directory
