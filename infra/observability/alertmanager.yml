global:
  resolve_timeout: 5m

route:
  receiver: __DEFAULT_RECEIVER__
  group_by: ['alertname', 'severity', 'team']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-log

  # Env-rendered shared receiver. In local-only mode keep
  # ALERTMANAGER_DEFAULT_RECEIVER=local-log. To deliver externally,
  # set:
  #   ALERTMANAGER_DEFAULT_RECEIVER=shared-webhook
  #   ALERTMANAGER_WEBHOOK_URL=https://...
  - name: shared-webhook
    webhook_configs:
      - url: __WEBHOOK_URL__
        send_resolved: true
