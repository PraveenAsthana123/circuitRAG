global:
  resolve_timeout: 5m

route:
  receiver: local-log
  group_by: ['alertname', 'severity', 'team']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-log

  # Placeholder receiver for later shared-environment integration.
  - name: placeholder-webhook
    webhook_configs:
      - url: http://host.docker.internal:8099/alertmanager-placeholder
        send_resolved: true
