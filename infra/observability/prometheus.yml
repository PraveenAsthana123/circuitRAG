# ============================================================================
# Prometheus — scrape targets for the DocuMind local dev stack
# ============================================================================
# Container exporters below are fixed.
#
# Host-native application services are mixed:
# - Go gateway-style services expose `/metrics` on the app port.
# - FastAPI services using `setup_observability(... prometheus_port=...)`
#   expose Prometheus on a separate host port chosen by the operator's
#   local start-env scripts, not necessarily on the HTTP app port.
#
# So the host.docker.internal targets below are "local-runtime contract"
# targets, not a blanket guarantee that every app speaks `/metrics` on
# 808x. Adjust Python-service targets to the actual
# `DOCUMIND_PROMETHEUS_PORT` values in your local env scripts.
#
# The OTel collector also exposes Prometheus-format metrics on :9464.
# ============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: documind-local

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # OTel collector (re-exports OTLP metrics received from services)
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]

  # Postgres exporter (postgresql connection / query / lock metrics)
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Application services.
  # api-gateway is a true app-port /metrics target.
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]

  # identity-svc/governance-svc/finops-svc/observability-svc are only valid
  # here if the host-native process on that port actually exposes /metrics.
  - job_name: identity-svc
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8081"]

  # FastAPI services (Python) expose Prometheus metrics on a SIDE-CHANNEL
  # port via documind_core.observability's start_http_server (NOT on the
  # main app port; that's where the HTTP API lives). Per-service ports
  # are deterministic to avoid collisions:
  #   retrieval=9467 · inference=9465 · ingestion=9470 ·
  #   evaluation=9469 · orchestrator=9466
  # (retrieval-svc originally :9464; moved to 9467 on 2026-05-09 because
  # OTel collector owns the host port :9464.)
  # metrics_path stays /metrics — just a different port from the app.
  - job_name: ingestion-svc
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9470"]

  - job_name: retrieval-svc
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9467"]

  - job_name: inference-svc
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9465"]

  - job_name: evaluation-svc
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9469"]

  - job_name: orchestrator-svc
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9466"]

  - job_name: governance-svc
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8086"]

  - job_name: finops-svc
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8087"]

  - job_name: observability-svc
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8088"]
