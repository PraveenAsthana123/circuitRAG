# Dev-machine override — resolves port conflicts + volume perms on shared hosts.
# docker-compose.override.yml is auto-merged with docker-compose.yml.
#
# Uses !override tag to REPLACE the base ports list (default behavior is merge,
# which doubles up bindings and keeps the conflicting defaults).
#
# Port map (non-defaults chosen to avoid common host occupants):
#   postgres 55432 · redis 56379 · kafka 59092 · minio 59000/59001
#   ollama 51134 · nginx disabled for dev (needs TLS cert setup)

services:
  postgres:
    ports: !override
      - "55432:5432"

  redis:
    ports: !override
      - "56379:6379"

  kafka:
    user: "0:0"
    # Keep BOTH listener mappings — 9092 internal listener (for in-cluster
    # clients, maps to host 59092 for visibility) AND 9094 external listener
    # (host-machine clients connect here). Advertised listeners in base
    # compose still say "localhost:9094" so external = localhost:9094.
    ports: !override
      - "59092:9092"
      - "9094:9094"

  minio:
    ports: !override
      - "59000:9000"
      - "59001:9001"

  ollama:
    ports: !override
      - "51134:11434"

  qdrant:
    # Dev: shared dev API key. Service + client both use it.
    environment:
      QDRANT__SERVICE__API_KEY: "dev-qdrant-key"

  # Disable nginx for dev — base image expects /etc/nginx/tls/server.crt.
  # Generate a self-signed cert or run the frontend + gateway directly for now.
  nginx:
    profiles: ["disabled"]

  # Volume-permission fix: default containers run as non-root user and bind
  # mounts are owned by the host user, causing EACCES on first boot.
  grafana:
    user: "0:0"
  prometheus:
    user: "0:0"
  zookeeper:
    user: "0:0"

  # Elasticsearch 8.x refuses to run as root + the bind-mounted ./data/elasticsearch
  # gets root ownership which uid 1000 (the elasticsearch user) cannot write.
  # Workaround: use a docker-managed named volume (override the bind mount).
  # Filebeat CAN run as root. Kibana CANNOT — it refuses to start as
  # root with "Kibana should not be run as root. Use --allow-root to
  # continue." The base docker-compose.yml sets kibana user: "1000:1000"
  # which is the correct fix; this override file does NOT touch kibana.
  elasticsearch:
    user: "1000:0"
    volumes: !override
      - es_data:/usr/share/elasticsearch/data
  filebeat:
    user: "0:0"

volumes:
  es_data:
