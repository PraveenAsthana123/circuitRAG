    evidence_path: "Ragas scaffold present; per-source relevance not yet logged"
  - id: 10
    scenario: "Risk agent review"
    operation: "Policy violation check"
    primary_tool: "OPA"
    span_name: "council.risk.review"
    required_fields: [council_id, agent_id, policy_decision, rule_id]
