# Agentic AI Operation Tracking — 35-scenario catalog (iter-96)
#
# Per CLAUDE.md §44 (iter-96), §47 (architecture), §57.4 (self-healing as
# data not code), §57.6 (canonical log fields).
#
# Source: user blueprint (paperclip / openclaw / kiali integration brief).
# Each scenario is captured as data so the audit script + drill + UI can
# tell the operator EXACTLY which scenarios are wired today and which
# are gaps.
#
# Required fields per scenario:
#   id              — stable ID (1..35)
#   scenario        — what's happening
#   operation       — the canonical operation/span name
#   primary_tool    — best tracking tool (Langfuse / Kiali / OPA / ...)
#   span_name       — OTel span name (mcp.<ns>.<op> convention)
#   required_fields — fields MUST be on every audit row
#   status          — wired | partial | gap (empirical, drilled)
#   evidence_path   — where to find proof of wiring (drill / log / dashboard)

version: 1
total_scenarios: 35

scenarios:
  - id: 1
    scenario: "User request received"
    operation: "API gateway accepts request, mints request_id"
    primary_tool: "API Gateway logs"
    span_name: "api.request.received"
    required_fields: [request_id, user_id, tenant_id]
    status: wired
    evidence_path: "services/api-gateway/ + libs/py/documind_core/middleware.py CorrelationIdMiddleware"
  - id: 2
    scenario: "Intent classification"
    operation: "Agent router detects intent + confidence"
    primary_tool: "LangGraph + Langfuse"
    span_name: "agent.router.classify"
    required_fields: [request_id, intent, confidence]
    status: partial
    evidence_path: "scripts/agent_router.py (Stage-1 heuristic; Langfuse hookup pending)"
  - id: 3
    scenario: "Risk classification"
    operation: "OPA / PolisAI evaluates risk tier"
    primary_tool: "OPA / PolisAI"
    span_name: "policy.risk.classify"
    required_fields: [request_id, risk_score, risk_tier]
    status: partial
    evidence_path: "config/policies/agent_dispatch.rego (default-deny); risk_score not yet emitted"
  - id: 4
    scenario: "Agent router decision"
    operation: "Selects agent path / lane (council_full | small_direct | tier_b | human)"
    primary_tool: "LangGraph"
    span_name: "agent.router.decide"
    required_fields: [request_id, route, model, estimated_cost_cents]
    status: wired
    evidence_path: "scripts/agent_lead.py decide_route() + emit() to .loop/agent_router_audit.jsonl"
  - id: 5
    scenario: "Planner agent starts"
    operation: "Council planner breaks goal into tasks"
    primary_tool: "LangGraph state"
    span_name: "council.planner.start"
    required_fields: [request_id, plan_id, agent_id]
    status: partial
    evidence_path: "scripts/local_council.py role=planner; LangGraph state-machine in agent-orchestrator-svc/app/langgraph_flow.py"
  - id: 6
    scenario: "Planner creates plan"
    operation: "Plan steps + dependency order persisted"
    primary_tool: "PostgreSQL audit DB"
    span_name: "council.planner.plan_create"
    required_fields: [request_id, plan_id, plan_version, steps, dependencies]
    status: gap
    evidence_path: "no PG audit table for plans yet; .loop/agent_task_board_apply.jsonl is filesystem-only"
  - id: 7
    scenario: "Council review starts"
    operation: "Multi-role review begins"
    primary_tool: "Council log"
    span_name: "council.review.start"
    required_fields: [council_id, agents_joined, plan_id]
    status: wired
    evidence_path: ".loop/council_runs.log + .loop/council_stats_daily.jsonl"
  - id: 8
    scenario: "Researcher agent review"
    operation: "Evidence quality scoring"
    primary_tool: "Langfuse"
    span_name: "council.researcher.review"
    required_fields: [council_id, agent_id, evidence_quality]
    status: gap
    evidence_path: "Langfuse container shipped; Researcher agent does not yet emit a quality score"
  - id: 9
    scenario: "Retriever agent review"
    operation: "Source relevance check"
    primary_tool: "Ragas"
