namespace: observe
status_target: WORKING
owner: platform-observability
fallback:
  on_unreachable: skip observe lookups; agent uses cached context if any; council notes 'observe unavailable'
  on_failing: circuit-break 60s after 3 consecutive failures; emit observe_circuit_open metric; alert P3
  on_not_installed: feature flag off (DOCUMIND_MCP_OBSERVE_URL unset); UI hides observe namespace
io:
- tool: observe.prom_query
  input_schema_ref: ObservePromQueryInput
  process: '1. Validate input via _validate_query (regex + length cap).

    2. _live_or_stub guard: return available:False if creds missing.

    3. Issue upstream call via _live_or_stub HTTP path.

    4. Map response to canonical output schema.

    5. Emit OTel span mcp.observe.prom_query + Prom counter.'
  output_schema_ref: ObservePromQueryOutput
  side_effects: read
  avg_latency_ms: 300
  p95_latency_ms: 1200
  cost_per_call_usd: 0.0
- tool: observe.compute_p95_delta
  input_schema_ref: ObserveComputeP95DeltaInput
  process: '1. Validate input via _validate_query (regex + length cap).

    2. _live_or_stub guard: return available:False if creds missing.

    3. Issue upstream call via _live_or_stub HTTP path.

    4. Map response to canonical output schema.

    5. Emit OTel span mcp.observe.compute_p95_delta + Prom counter.'
  output_schema_ref: ObserveComputeP95DeltaOutput
  side_effects: read
  avg_latency_ms: 300
  p95_latency_ms: 1200
  cost_per_call_usd: 0.0
- tool: observe.check_alerts_fired
  input_schema_ref: ObserveCheckAlertsFiredInput
  process: '1. Validate input via _validate_query (regex + length cap).

    2. _live_or_stub guard: return available:False if creds missing.

    3. Issue upstream call via _live_or_stub HTTP path.

    4. Map response to canonical output schema.

    5. Emit OTel span mcp.observe.check_alerts_fired + Prom counter.'
  output_schema_ref: ObserveCheckAlertsFiredOutput
  side_effects: read
  avg_latency_ms: 300
  p95_latency_ms: 1200
  cost_per_call_usd: 0.0
integration:
  upstream:
  - inference-svc
  - agent-orchestrator-svc
  downstream: []
  contracts:
  - producer: inference-svc
    consumer: observe
    schema: McpToolCallRequest
testing:
  drill: mcp/tests/drill_mcp_sdlc_servers.py
  smoke_cmd: curl -s $DOCUMIND_MCP_OBSERVE_URL/health
  cadence: iter
  scheduled_via: scripts/run_drills.py
monitoring:
  metrics:
  - name: mcp_observe_requests_total
    type: counter
    alert_at: informational
  - name: mcp_observe_request_duration_seconds
    type: histogram
    alert_at: p95 > 2s for 5m
  - name: mcp_observe_circuit_open
    type: gauge
    alert_at: value == 1 for 5m
  alerts:
  - name: ObserveCircuitOpen
    severity: P3
    route: '#oncall-platform-observability'
visualization:
  ui_page: /admin/mcp-fleet-health
  embed_in:
  - /admin/dashboard
  - /admin/mcp-fleet-health
  panels:
  - status
  - latency_p95
  - error_rate
  - qps
policy:
  opa_bundle: config/policies/agent_dispatch.rego
  rules:
  - council-observe-read
  - council-observe-read
  - council-observe-read
  default: deny
observability:
  otel:
    span_name: mcp.observe.tools_call
    attrs:
    - tenant_id
    - request_id
    - scopes_granted
    - tool_name
  jaeger:
    query_template: service=mcp-observe&operation=mcp.observe.tools_call
  kibana:
    index: filebeat-mcp-*
    query_template: kubernetes.labels.app:mcp-observe AND request_id:{request_id}
  log_fields:
  - request_id
  - tenant_id
  - actor
  - tool
  - latency_ms
  - outcome
runbook: ops/runbook/observe.md
