namespace: gcp
status_target: OPTIONAL
owner: platform-cloud
fallback:
  on_unreachable: skip gcp lookups; agent uses cached context if any; council notes 'gcp unavailable'
  on_failing: circuit-break 60s after 3 consecutive failures; emit gcp_circuit_open metric; alert P3
  on_not_installed: feature flag off (DOCUMIND_MCP_GCP_URL unset); UI hides gcp namespace
io:
- tool: gcp.gce_list_instances
  input_schema_ref: GcpGceListInstancesInput
  process: '1. Validate input via _validate_query (regex + length cap).

    2. _live_or_stub guard: return available:False if creds missing.

    3. Issue upstream call via _live_or_stub HTTP path.

    4. Map response to canonical output schema.

    5. Emit OTel span mcp.gcp.gce_list_instances + Prom counter.'
  output_schema_ref: GcpGceListInstancesOutput
  side_effects: read
  avg_latency_ms: 300
  p95_latency_ms: 1200
  cost_per_call_usd: 0.0
- tool: gcp.gcs_list_bucket
  input_schema_ref: GcpGcsListBucketInput
  process: '1. Validate input via _validate_query (regex + length cap).

    2. _live_or_stub guard: return available:False if creds missing.

    3. Issue upstream call via _live_or_stub HTTP path.

    4. Map response to canonical output schema.

    5. Emit OTel span mcp.gcp.gcs_list_bucket + Prom counter.'
  output_schema_ref: GcpGcsListBucketOutput
  side_effects: read
  avg_latency_ms: 300
  p95_latency_ms: 1200
  cost_per_call_usd: 0.0
integration:
  upstream:
  - inference-svc
  - agent-orchestrator-svc
  downstream: []
  contracts:
  - producer: inference-svc
    consumer: gcp
    schema: McpToolCallRequest
testing:
  drill: mcp/tests/drill_mcp_sdlc_servers.py
  smoke_cmd: curl -s $DOCUMIND_MCP_GCP_URL/health
  cadence: iter
  scheduled_via: scripts/run_drills.py
monitoring:
  metrics:
  - name: mcp_gcp_requests_total
    type: counter
    alert_at: informational
  - name: mcp_gcp_request_duration_seconds
    type: histogram
    alert_at: p95 > 2s for 5m
  - name: mcp_gcp_circuit_open
    type: gauge
    alert_at: value == 1 for 5m
  alerts:
  - name: GcpCircuitOpen
    severity: P3
    route: '#oncall-platform-cloud'
visualization:
  ui_page: /admin/mcp-fleet-health
  embed_in:
  - /admin/dashboard
  - /admin/mcp-fleet-health
  panels:
  - status
  - latency_p95
  - error_rate
  - qps
policy:
  opa_bundle: config/policies/agent_dispatch.rego
  rules:
  - council-gcp-read
  - council-gcp-read
  default: deny
observability:
  otel:
    span_name: mcp.gcp.tools_call
    attrs:
    - tenant_id
    - request_id
    - scopes_granted
    - tool_name
  jaeger:
    query_template: service=mcp-gcp&operation=mcp.gcp.tools_call
  kibana:
    index: filebeat-mcp-*
    query_template: kubernetes.labels.app:mcp-gcp AND request_id:{request_id}
  log_fields:
  - request_id
  - tenant_id
  - actor
  - tool
  - latency_ms
  - outcome
runbook: ops/runbook/gcp.md
