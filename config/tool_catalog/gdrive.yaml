namespace: gdrive
status_target: OPTIONAL
owner: platform-knowledge
fallback:
  on_unreachable: skip gdrive lookups; agent uses cached context if any; council notes 'gdrive unavailable'
  on_failing: circuit-break 60s after 3 consecutive failures; emit gdrive_circuit_open metric; alert P3
  on_not_installed: feature flag off (DOCUMIND_MCP_GDRIVE_URL unset); UI hides gdrive namespace
io:
- tool: gdrive.file_search
  input_schema_ref: GdriveFileSearchInput
  process: '1. Validate input via _validate_query (regex + length cap).

    2. _live_or_stub guard: return available:False if creds missing.

    3. Issue upstream call via _live_or_stub HTTP path.

    4. Map response to canonical output schema.

    5. Emit OTel span mcp.gdrive.file_search + Prom counter.'
  output_schema_ref: GdriveFileSearchOutput
  side_effects: read
  avg_latency_ms: 300
  p95_latency_ms: 1200
  cost_per_call_usd: 0.0
- tool: gdrive.file_get_metadata
  input_schema_ref: GdriveFileGetMetadataInput
  process: '1. Validate input via _validate_query (regex + length cap).

    2. _live_or_stub guard: return available:False if creds missing.

    3. Issue upstream call via _live_or_stub HTTP path.

    4. Map response to canonical output schema.

    5. Emit OTel span mcp.gdrive.file_get_metadata + Prom counter.'
  output_schema_ref: GdriveFileGetMetadataOutput
  side_effects: read
  avg_latency_ms: 300
  p95_latency_ms: 1200
  cost_per_call_usd: 0.0
integration:
  upstream:
  - inference-svc
  - agent-orchestrator-svc
  downstream: []
  contracts:
  - producer: inference-svc
    consumer: gdrive
    schema: McpToolCallRequest
testing:
  drill: mcp/tests/drill_mcp_sdlc_servers.py
  smoke_cmd: curl -s $DOCUMIND_MCP_GDRIVE_URL/health
  cadence: iter
  scheduled_via: scripts/run_drills.py
monitoring:
  metrics:
  - name: mcp_gdrive_requests_total
    type: counter
    alert_at: informational
  - name: mcp_gdrive_request_duration_seconds
    type: histogram
    alert_at: p95 > 2s for 5m
  - name: mcp_gdrive_circuit_open
    type: gauge
    alert_at: value == 1 for 5m
  alerts:
  - name: GdriveCircuitOpen
    severity: P3
    route: '#oncall-platform-knowledge'
visualization:
  ui_page: /admin/mcp-fleet-health
  embed_in:
  - /admin/dashboard
  - /admin/mcp-fleet-health
  panels:
  - status
  - latency_p95
  - error_rate
  - qps
policy:
  opa_bundle: config/policies/agent_dispatch.rego
  rules:
  - council-gdrive-read
  - council-gdrive-read
  default: deny
observability:
  otel:
    span_name: mcp.gdrive.tools_call
    attrs:
    - tenant_id
    - request_id
    - scopes_granted
    - tool_name
  jaeger:
    query_template: service=mcp-gdrive&operation=mcp.gdrive.tools_call
  kibana:
    index: filebeat-mcp-*
    query_template: kubernetes.labels.app:mcp-gdrive AND request_id:{request_id}
  log_fields:
  - request_id
  - tenant_id
  - actor
  - tool
  - latency_ms
  - outcome
runbook: ops/runbook/gdrive.md
