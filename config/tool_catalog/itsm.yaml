namespace: itsm
status_target: WORKING
owner: platform-itsm
fallback:
  on_unreachable: skip itsm lookups; agent uses cached context if any; council notes 'itsm unavailable'
  on_failing: circuit-break 60s after 3 consecutive failures; emit itsm_circuit_open metric; alert P3
  on_not_installed: feature flag off (DOCUMIND_MCP_ITSM_URL unset); UI hides itsm namespace
io:
- tool: itsm.incident_lookup
  input_schema_ref: ItsmIncidentLookupInput
  process: '1. Validate input via _validate_query (regex + length cap).

    2. _live_or_stub guard: return available:False if creds missing.

    3. Issue upstream call via _live_or_stub HTTP path.

    4. Map response to canonical output schema.

    5. Emit OTel span mcp.itsm.incident_lookup + Prom counter.'
  output_schema_ref: ItsmIncidentLookupOutput
  side_effects: read
  avg_latency_ms: 300
  p95_latency_ms: 1200
  cost_per_call_usd: 0.0
- tool: itsm.incident_open
  input_schema_ref: ItsmIncidentOpenInput
  process: '1. Validate input via _validate_query (regex + length cap).

    2. _live_or_stub guard: return available:False if creds missing.

    3. Issue upstream call via _live_or_stub HTTP path.

    4. Map response to canonical output schema.

    5. Emit OTel span mcp.itsm.incident_open + Prom counter.'
  output_schema_ref: ItsmIncidentOpenOutput
  side_effects: read
  avg_latency_ms: 300
  p95_latency_ms: 1200
  cost_per_call_usd: 0.0
integration:
  upstream:
  - inference-svc
  - agent-orchestrator-svc
  downstream: []
  contracts:
  - producer: inference-svc
    consumer: itsm
    schema: McpToolCallRequest
testing:
  drill: mcp/tests/drill_mcp_sdlc_servers.py
  smoke_cmd: curl -s $DOCUMIND_MCP_ITSM_URL/health
  cadence: iter
  scheduled_via: scripts/run_drills.py
monitoring:
  metrics:
  - name: mcp_itsm_requests_total
    type: counter
    alert_at: informational
  - name: mcp_itsm_request_duration_seconds
    type: histogram
    alert_at: p95 > 2s for 5m
  - name: mcp_itsm_circuit_open
    type: gauge
    alert_at: value == 1 for 5m
  alerts:
  - name: ItsmCircuitOpen
    severity: P3
    route: '#oncall-platform-itsm'
visualization:
  ui_page: /admin/mcp-fleet-health
  embed_in:
  - /admin/dashboard
  - /admin/mcp-fleet-health
  panels:
  - status
  - latency_p95
  - error_rate
  - qps
policy:
  opa_bundle: config/policies/agent_dispatch.rego
  rules:
  - council-itsm-read
  - council-itsm-read
  default: deny
observability:
  otel:
    span_name: mcp.itsm.tools_call
    attrs:
    - tenant_id
    - request_id
    - scopes_granted
    - tool_name
  jaeger:
    query_template: service=mcp-itsm&operation=mcp.itsm.tools_call
  kibana:
    index: filebeat-mcp-*
    query_template: kubernetes.labels.app:mcp-itsm AND request_id:{request_id}
  log_fields:
  - request_id
  - tenant_id
  - actor
  - tool
  - latency_ms
  - outcome
runbook: ops/runbook/itsm.md
