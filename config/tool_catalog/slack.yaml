namespace: slack
status_target: OPTIONAL
owner: platform-comms

fallback:
  on_unreachable: "skip channel/message lookups; UI shows 'slack offline' banner; council does not include slack-derived context"
  on_failing: "circuit-break 60s after 3 consecutive failures; emit slack_circuit_open metric; alert P3"
  on_not_installed: "feature flag off (DOCUMIND_MCP_SLACK_URL unset); UI hides slack namespace section"

io:
  - tool: slack.channel_list
    input_schema_ref: SlackChannelListInput
    process: |
      1. Validate query (regex + length cap).
      2. _live_or_stub: if SLACK_BOT_TOKEN missing → return available:False stub.
      3. POST to Slack /conversations.list with bot token; paginate.
      4. Filter to channels matching query substring.
      5. Return {available: True, channels: [{id, name, is_private}]}
    output_schema_ref: SlackChannelListOutput
    side_effects: read
    avg_latency_ms: 250
    p95_latency_ms: 800
    cost_per_call_usd: 0.0
  - tool: slack.message_search
    input_schema_ref: SlackMessageSearchInput
    process: |
      1. Validate query (forbid SQL/shell metachars via _QUERY_FORBIDDEN_RE).
      2. _live_or_stub guard.
      3. POST to Slack /search.messages.
      4. Map to {channel, user, ts, text}.
    output_schema_ref: SlackMessageSearchOutput
    side_effects: read
    avg_latency_ms: 400
    p95_latency_ms: 1500
    cost_per_call_usd: 0.0

integration:
  upstream: [inference-svc, agent-orchestrator-svc]
  downstream: []
  contracts:
    - { producer: inference-svc, consumer: slack, schema: McpToolCallRequest }

testing:
  drill: mcp/tests/drill_mcp_sdlc_servers.py
  smoke_cmd: "curl -s $DOCUMIND_MCP_SLACK_URL/health"
  cadence: iter
  scheduled_via: scripts/run_drills.py

monitoring:
  metrics:
    - { name: mcp_slack_requests_total, type: counter, alert_at: "informational" }
    - { name: mcp_slack_request_duration_seconds, type: histogram, alert_at: "p95 > 2s for 5m" }
    - { name: mcp_slack_circuit_open, type: gauge, alert_at: "value == 1 for 5m" }
  alerts:
    - { name: SlackCircuitOpen, severity: P3, route: "#oncall-platform-comms" }

visualization:
  ui_page: /admin/mcp-fleet-health
  embed_in: [/admin/dashboard, /admin/mcp-fleet-health]
  panels: [status, latency_p95, error_rate, qps]

policy:
  opa_bundle: config/policies/agent_dispatch.rego
  rules: [council-author-slack-read, council-reviewer-slack-read]
  default: deny

observability:
  otel:
    span_name: mcp.slack.tools_call
    attrs: [tenant_id, request_id, scopes_granted, tool_name]
  jaeger:
    query_template: "service=mcp-slack&operation=mcp.slack.tools_call"
  kibana:
    index: filebeat-mcp-*
    query_template: "kubernetes.labels.app:mcp-slack AND request_id:{request_id}"
  log_fields: [request_id, tenant_id, actor, tool, latency_ms, outcome]

runbook: ops/runbook/slack.md
