namespace: paperclip
status_target: WORKING
owner: platform-ai
fallback:
  on_unreachable: skip paperclip lookups; agent uses cached context if any; council notes 'paperclip unavailable'
  on_failing: circuit-break 60s after 3 consecutive failures; emit paperclip_circuit_open metric; alert P3
  on_not_installed: feature flag off (DOCUMIND_MCP_PAPERCLIP_URL unset); UI hides paperclip namespace
io:
- tool: paperclip.snapshot
  input_schema_ref: PaperclipSnapshotInput
  process: '1. Validate input via _validate_query (regex + length cap).

    2. _live_or_stub guard: return available:False if creds missing.

    3. Issue upstream call via _live_or_stub HTTP path.

    4. Map response to canonical output schema.

    5. Emit OTel span mcp.paperclip.snapshot + Prom counter.'
  output_schema_ref: PaperclipSnapshotOutput
  side_effects: read
  avg_latency_ms: 300
  p95_latency_ms: 1200
  cost_per_call_usd: 0.0
- tool: paperclip.health
  input_schema_ref: PaperclipHealthInput
  process: '1. Validate input via _validate_query (regex + length cap).

    2. _live_or_stub guard: return available:False if creds missing.

    3. Issue upstream call via _live_or_stub HTTP path.

    4. Map response to canonical output schema.

    5. Emit OTel span mcp.paperclip.health + Prom counter.'
  output_schema_ref: PaperclipHealthOutput
  side_effects: read
  avg_latency_ms: 300
  p95_latency_ms: 1200
  cost_per_call_usd: 0.0
integration:
  upstream:
  - inference-svc
  - agent-orchestrator-svc
  downstream: []
  contracts:
  - producer: inference-svc
    consumer: paperclip
    schema: McpToolCallRequest
testing:
  drill: mcp/tests/drill_mcp_server_paperclip.py
  smoke_cmd: curl -s $DOCUMIND_MCP_PAPERCLIP_URL/health
  cadence: iter
  scheduled_via: scripts/run_drills.py
monitoring:
  metrics:
  - name: mcp_paperclip_requests_total
    type: counter
    alert_at: informational
  - name: mcp_paperclip_request_duration_seconds
    type: histogram
    alert_at: p95 > 2s for 5m
  - name: mcp_paperclip_circuit_open
    type: gauge
    alert_at: value == 1 for 5m
  alerts:
  - name: PaperclipCircuitOpen
    severity: P3
    route: '#oncall-platform-ai'
visualization:
  ui_page: /admin/mcp-fleet-health
  embed_in:
  - /admin/dashboard
  - /admin/mcp-fleet-health
  panels:
  - status
  - latency_p95
  - error_rate
  - qps
policy:
  opa_bundle: config/policies/agent_dispatch.rego
  rules:
  - council-paperclip-read
  - council-paperclip-read
  default: deny
observability:
  otel:
    span_name: mcp.paperclip.tools_call
    attrs:
    - tenant_id
    - request_id
    - scopes_granted
    - tool_name
  jaeger:
    query_template: service=mcp-paperclip&operation=mcp.paperclip.tools_call
  kibana:
    index: filebeat-mcp-*
    query_template: kubernetes.labels.app:mcp-paperclip AND request_id:{request_id}
  log_fields:
  - request_id
  - tenant_id
  - actor
  - tool
  - latency_ms
  - outcome
runbook: ops/runbook/paperclip.md
